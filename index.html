<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#080a0e;--deep:#0d1018;--surface:#12151d;--raised:#181c26;
  --border:rgba(255,255,255,0.07);--gold:#c4a15d;--gold-light:#dfc07e;
  --muted:#5a6070;--mid:#8a91a0;--light:#c8cdd8;--white:#f0ede8;
}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--ink);color:var(--light);font-family:'Archivo',sans-serif;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;cursor:none}

/* ── CUSTOM CURSOR ── */
#cursor{position:fixed;width:10px;height:10px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform 0.1s,width 0.2s,height 0.2s,opacity 0.2s;mix-blend-mode:difference}
#cursor-ring{position:fixed;width:36px;height:36px;border:1px solid var(--gold);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform 0.12s ease,width 0.25s,height 0.25s,opacity 0.2s;opacity:0.6}
body.cursor-hover #cursor{width:20px;height:20px}
body.cursor-hover #cursor-ring{width:52px;height:52px;opacity:0.3}
@media(hover:none){#cursor,#cursor-ring{display:none}body{cursor:auto}}

/* ── NOISE ── */
body::before{content:'';position:fixed;inset:0;opacity:0.025;pointer-events:none;z-index:10000;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px}

/* ── PROGRESS BAR ── */
#progress-bar{position:fixed;top:0;left:0;height:2px;background:var(--gold);z-index:9997;width:0%;transition:width 0.1s linear}

/* ── TYPOGRAPHY ── */
.display{font-family:'Cormorant Garamond',serif;font-weight:300;line-height:1.05;letter-spacing:-0.02em}
.label{font-size:0.65rem;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold)}
.section-num{font-family:'Cormorant Garamond',serif;font-size:0.8rem;color:var(--muted);letter-spacing:0.15em}
.gold-rule{width:40px;height:1px;background:var(--gold);display:inline-block}

/* ── HEADER ── */
header{position:fixed;top:0;width:100%;z-index:500;padding:0 3rem;height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(8,10,14,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo-mark{width:36px;height:36px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--gold)}
.logo-text{font-size:0.85rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--white)}
nav{display:flex;gap:2.5rem;align-items:center}
nav a{font-size:0.72rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color 0.25s}
nav a:hover{color:var(--white)}
.btn-primary{display:inline-flex;align-items:center;gap:8px;font-size:0.7rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:12px 28px;text-decoration:none;transition:background 0.25s,transform 0.25s;border:none;cursor:pointer}
.btn-primary:hover{background:var(--gold-light);transform:translateY(-1px)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;font-size:0.7rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--light);border:1px solid var(--border);padding:12px 28px;text-decoration:none;transition:border-color 0.25s,color 0.25s;background:transparent;cursor:pointer}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
#mobile-menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--white)}
#mobile-menu{display:none}

/* ── DARK/LIGHT TOGGLE ── */
.theme-btn{background:none;border:1px solid var(--border);color:var(--mid);padding:8px 12px;cursor:pointer;font-size:0.75rem;transition:border-color 0.25s,color 0.25s;display:flex;align-items:center;gap:6px}
.theme-btn:hover{border-color:var(--gold);color:var(--gold)}
body.light-mode{--ink:#f5f3ef;--deep:#ede9e2;--surface:#e8e3da;--raised:#ddd8ce;--border:rgba(0,0,0,0.1);--muted:#9a9488;--mid:#6b6559;--light:#3a342a;--white:#1a140d}
body.light-mode header{background:rgba(245,243,239,0.92)}

/* ── HERO ── */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;padding-top:80px;overflow:hidden}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:8rem 3rem;border-right:1px solid var(--border);position:relative;z-index:2}
.hero-right{position:relative;overflow:hidden;background:var(--deep);display:flex;flex-direction:column;justify-content:flex-end;padding:3rem}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;filter:grayscale(40%) contrast(1.1);transition:opacity 0.6s}
.hero-right:hover .hero-img{opacity:0.45}
.hero-right::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,14,0.95) 0%,rgba(8,10,14,0.4) 50%,rgba(8,10,14,0.2) 100%);z-index:1}
.hero-right-content{position:relative;z-index:2}
.hero-deco-num{position:absolute;top:2rem;right:2rem;font-family:'Cormorant Garamond',serif;font-size:10rem;font-weight:300;color:rgba(196,161,93,0.06);line-height:1;pointer-events:none;z-index:2}
.hero-eyebrow{display:flex;align-items:center;gap:16px;margin-bottom:2.5rem}
.hero-title{font-size:clamp(3rem,4.5vw,5rem);color:var(--white);margin-bottom:2rem}
.hero-title em{color:var(--gold);display:block}
.hero-body{font-size:0.95rem;color:var(--mid);max-width:420px;margin-bottom:3rem;line-height:1.8}
.hero-actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.stat-strip{border-top:1px solid rgba(255,255,255,0.12);padding-top:2rem;display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:2.6rem;font-weight:300;color:var(--white);line-height:1;margin-bottom:0.3rem}
.stat-label{font-size:0.66rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--mid)}

/* counter animation */
.count-up{display:inline-block}

/* ── PRESS STRIP ── */
.press-strip{padding:2.5rem 3rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--deep);display:flex;align-items:center;gap:3rem;overflow:hidden}
.press-label{font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex-shrink:0}
.press-logos{display:flex;align-items:center;gap:3rem;animation:marquee 20s linear infinite;white-space:nowrap}
.press-logos span{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:300;color:var(--muted);letter-spacing:0.08em;transition:color 0.25s;cursor:default}
.press-logos span:hover{color:var(--gold)}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ── RISK ── */
.risk-section{padding:8rem 0;border-top:1px solid var(--border);background:var(--deep)}
.container{max-width:1200px;margin:0 auto;padding:0 3rem}
.section-header{margin-bottom:5rem}
.section-title{font-size:clamp(2.5rem,4vw,3.8rem);color:var(--white);margin-top:1rem}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border)}
.risk-card{padding:3rem;border-right:1px solid var(--border);position:relative;transition:background 0.3s;overflow:hidden}
.risk-card:last-child{border-right:none}
.risk-card:hover{background:var(--surface)}
.risk-card-img{width:100%;height:140px;object-fit:cover;opacity:0.25;filter:grayscale(60%);margin-bottom:1.5rem;transition:opacity 0.4s;display:block}
.risk-card:hover .risk-card-img{opacity:0.4}
.risk-number{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;color:rgba(196,161,93,0.18);line-height:1;margin-bottom:1rem}
.risk-card h3{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:400;color:var(--white);margin-bottom:0.75rem}
.risk-card p{font-size:0.83rem;color:var(--muted);line-height:1.8}
.risk-accent{position:absolute;bottom:0;left:3rem;width:0;height:1px;background:var(--gold);transition:width 0.4s}
.risk-card:hover .risk-accent{width:calc(100% - 6rem)}

/* ── ROI CALCULATOR ── */
.roi-section{padding:8rem 0;border-top:1px solid var(--border)}
.roi-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start}
.roi-form{display:flex;flex-direction:column;gap:0}
.roi-field{padding:1.5rem 0;border-bottom:1px solid var(--border)}
.roi-field:first-child{border-top:1px solid var(--border)}
.roi-field label{display:block;font-size:0.63rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:0.75rem}
.roi-field input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:1px;background:var(--border);outline:none;margin-bottom:0.5rem}
.roi-field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--gold);border-radius:50%;cursor:pointer}
.roi-field input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--gold);border-radius:50%;cursor:pointer;border:none}
.roi-val{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--white)}
.roi-results{background:var(--surface);border:1px solid var(--border);padding:3rem;position:sticky;top:100px}
.roi-results-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--gold);margin-bottom:2rem;letter-spacing:0.05em}
.roi-metric{padding:1.2rem 0;border-bottom:1px solid var(--border)}
.roi-metric:last-child{border-bottom:none}
.roi-metric-label{font-size:0.63rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem}
.roi-metric-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--white)}
.roi-metric-val.highlight{color:var(--gold)}
.roi-note{font-size:0.72rem;color:var(--muted);margin-top:1.5rem;line-height:1.7;font-style:italic}

/* ── SERVICES ── */
.services-section{padding:8rem 0;border-top:1px solid var(--border)}
.service-row{display:grid;grid-template-columns:80px 1fr 280px;gap:3rem;padding:3.5rem 0;border-bottom:1px solid var(--border);align-items:center;transition:background 0.3s}
.service-row:first-of-type{border-top:1px solid var(--border)}
.service-row:hover{background:var(--surface);margin:0 -3rem;padding:3.5rem 3rem}
.service-index{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--muted)}
.service-name{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;color:var(--white);margin-bottom:0.75rem}
.service-desc{font-size:0.83rem;color:var(--mid);margin-bottom:1.2rem;line-height:1.8}
.service-tags{display:flex;flex-wrap:wrap;gap:0.5rem}
.service-tag{font-size:0.63rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(196,161,93,0.25);padding:5px 12px}
.service-thumb{width:100%;height:180px;object-fit:cover;opacity:0.5;filter:grayscale(50%) contrast(1.1);transition:opacity 0.4s,filter 0.4s;border:1px solid var(--border)}
.service-row:hover .service-thumb{opacity:0.75;filter:grayscale(20%) contrast(1.1)}

/* ── CASE STUDIES ── */
.cases-section{padding:8rem 0;border-top:1px solid var(--border);background:var(--deep)}
.cases-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:1px}
.case-card{background:var(--surface);padding:2.5rem;border:1px solid var(--border);position:relative;overflow:hidden;transition:background 0.3s}
.case-card:hover{background:var(--raised)}
.case-tag{font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem;display:block}
.case-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--white);margin-bottom:1rem;font-weight:400}
.case-desc{font-size:0.8rem;color:var(--muted);line-height:1.8;margin-bottom:1.5rem}
.case-metrics{display:flex;gap:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.case-metric{}
.case-metric-num{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--gold);line-height:1}
.case-metric-label{font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}

/* ── TESTIMONIALS ── */
.testi-section{padding:8rem 0;border-top:1px solid var(--border)}
.testi-track{overflow:hidden;position:relative}
.testi-slides{display:flex;transition:transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94)}
.testi-slide{min-width:100%;padding:0 2rem}
.testi-quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.4rem,2.5vw,2rem);color:var(--white);line-height:1.5;margin-bottom:2rem;font-weight:300}
.testi-quote span{color:var(--gold)}
.testi-author{display:flex;align-items:center;gap:1rem}
.testi-avatar{width:44px;height:44px;border-radius:50%;background:var(--raised);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--gold)}
.testi-name{font-size:0.82rem;font-weight:500;color:var(--light)}
.testi-role{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
.testi-controls{display:flex;gap:0.75rem;margin-top:3rem}
.testi-btn{width:36px;height:36px;border:1px solid var(--border);background:none;color:var(--mid);cursor:pointer;transition:border-color 0.25s,color 0.25s;display:flex;align-items:center;justify-content:center}
.testi-btn:hover{border-color:var(--gold);color:var(--gold)}
.testi-dots{display:flex;gap:0.5rem;align-items:center;margin-left:1rem}
.testi-dot{width:6px;height:6px;border-radius:50%;background:var(--border);cursor:pointer;transition:background 0.25s}
.testi-dot.active{background:var(--gold)}

/* ── BANNER ── */
.img-banner{width:100%;height:420px;position:relative;overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.img-banner img{width:100%;height:100%;object-fit:cover;opacity:0.28;filter:grayscale(50%) contrast(1.15)}
.img-banner-overlay{position:absolute;inset:0;background:linear-gradient(120deg,rgba(8,10,14,0.95) 0%,rgba(8,10,14,0.5) 60%,rgba(8,10,14,0.3) 100%);display:flex;align-items:center;padding:0 3rem}
.img-banner-text blockquote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.8rem,3vw,2.8rem);font-weight:300;color:var(--white);line-height:1.3;margin-bottom:1.5rem}
.img-banner-text blockquote span{color:var(--gold)}
.img-banner-text cite{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);font-style:normal}

/* ── METHODOLOGY ── */
.method-section{padding:8rem 0;border-top:1px solid var(--border);background:var(--deep)}
.method-steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:5rem}
.method-step{padding:2.5rem;border-right:1px solid var(--border)}
.method-step:last-child{border-right:none}
.step-num{font-family:'Cormorant Garamond',serif;font-size:3.5rem;font-weight:300;color:rgba(196,161,93,0.18);line-height:1;margin-bottom:1.5rem}
.step-title{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--white);margin-bottom:0.75rem}
.step-desc{font-size:0.8rem;color:var(--muted);line-height:1.8}
.step-active .step-num{color:rgba(196,161,93,0.5)}
.step-active .step-title{color:var(--gold)}

/* ── TEAM ── */
.team-section{padding:8rem 0;border-top:1px solid var(--border)}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:1rem}
.team-card{border:1px solid var(--border);overflow:hidden;transition:border-color 0.3s}
.team-card:hover{border-color:rgba(196,161,93,0.3)}
.team-img-wrap{height:240px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center}
.team-initials{font-family:'Cormorant Garamond',serif;font-size:4rem;font-weight:300;color:rgba(196,161,93,0.2)}
.team-info{padding:1.5rem}
.team-name{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--white);margin-bottom:0.25rem}
.team-role{font-size:0.66rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem}
.team-bio{font-size:0.78rem;color:var(--muted);line-height:1.7}

/* ── CERTIFICATIONS ── */
.cert-strip{padding:4rem 0;border-top:1px solid var(--border);background:var(--deep)}
.cert-grid{display:flex;gap:3rem;align-items:center;justify-content:center;flex-wrap:wrap}
.cert-badge{display:flex;align-items:center;gap:1rem;padding:1rem 2rem;border:1px solid var(--border)}
.cert-icon{width:36px;height:36px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:0.9rem;font-weight:600;color:var(--ink)}
.cert-label{font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--light)}

/* ── FAQ ── */
.faq-section{padding:8rem 0;border-top:1px solid var(--border)}
.faq-list{margin-top:1rem}
.faq-item{border-bottom:1px solid var(--border)}
.faq-item:first-child{border-top:1px solid var(--border)}
.faq-question{width:100%;background:none;border:none;color:var(--white);font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:400;text-align:left;padding:1.75rem 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:2rem;transition:color 0.25s}
.faq-question:hover{color:var(--gold)}
.faq-question.open{color:var(--gold)}
.faq-icon{font-size:1.5rem;color:var(--gold);transition:transform 0.3s;flex-shrink:0;line-height:1}
.faq-question.open .faq-icon{transform:rotate(45deg)}
.faq-answer{max-height:0;overflow:hidden;transition:max-height 0.4s ease,padding 0.3s}
.faq-answer.open{max-height:400px;padding-bottom:1.5rem}
.faq-answer p{font-size:0.88rem;color:var(--muted);line-height:1.9}

/* ── MAP ── */
.map-section{padding:8rem 0;border-top:1px solid var(--border);background:var(--deep)}
.map-wrap{position:relative;height:360px;background:var(--surface);border:1px solid var(--border);overflow:hidden;margin-top:4rem}
.map-svg{width:100%;height:100%;opacity:0.15}
.map-dots{p

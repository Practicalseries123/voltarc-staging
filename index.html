<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltArc Engineering | Zero-Downtime Power Solutions</title>
    <meta name="description" content="Premium commercial electrical engineering firm specializing in infrastructure audits and resilient power systems.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #080a0e;
            --deep: #0d1018;
            --surface: #12151d;
            --raised: #181c26;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(196,161,93,0.4);
            --gold: #c4a15d;
            --gold-light: #dfc07e;
            --gold-dim: rgba(196,161,93,0.15);
            --muted: #5a6070;
            --mid: #8a91a0;
            --light: #c8cdd8;
            --white: #f0ede8;
        }

        html { font-size: 16px; }

        body {
            background: var(--ink);
            color: var(--light);
            font-family: 'Archivo', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ─── NOISE OVERLAY ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.025;
            pointer-events: none;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        /* ─── TYPOGRAPHY ─── */
        .display {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }
        .display-italic {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
        }
        .label {
            font-family: 'Archivo', sans-serif;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
        }
        .section-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.15em;
        }

        /* ─── GOLD LINE ─── */
        .gold-rule {
            width: 40px;
            height: 1px;
            background: var(--gold);
            display: inline-block;
        }

        /* ─── HEADER ─── */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: 0 3rem;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(8,10,14,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: background 0.3s;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }
        .logo-mark {
            width: 36px;
            height: 36px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: var(--gold);
            letter-spacing: 0.05em;
        }
        .logo-text {
            font-family: 'Archivo', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--white);
        }

        nav { display: flex; gap: 2.5rem; align-items: center; }
        nav a {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--mid);
            text-decoration: none;
            transition: color 0.25s;
        }
        nav a:hover { color: var(--white); }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--ink);
            background: var(--gold);
            padding: 12px 28px;
            text-decoration: none;
            transition: background 0.25s, transform 0.25s;
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }
        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--light);
            border: 1px solid var(--border);
            padding: 12px 28px;
            text-decoration: none;
            transition: border-color 0.25s, color 0.25s;
            background: transparent;
            cursor: pointer;
        }
        .btn-ghost:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ─── HERO ─── */
        .hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding-top: 80px;
            position: relative;
            overflow: hidden;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8rem 3rem 8rem 3rem;
            border-right: 1px solid var(--border);
            position: relative;
        }

        .hero-right {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 8rem 3rem;
            position: relative;
            background: var(--deep);
            overflow: hidden;
        }

        .hero-right::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(196,161,93,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-eyebrow {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 2.5rem;
        }

        .hero-title {
            font-size: clamp(3.5rem, 5vw, 5.5rem);
            color: var(--white);
            margin-bottom: 2rem;
        }
        .hero-title em {
            color: var(--gold);
            display: block;
        }

        .hero-body {
            font-size: 0.95rem;
            color: var(--mid);
            max-width: 420px;
            margin-bottom: 3rem;
            line-height: 1.8;
        }

        .hero-actions { display: flex; gap: 1rem; align-items: center; }

        /* Large decorative number */
        .hero-deco-num {
            position: absolute;
            top: 3rem;
            right: 3rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 12rem;
            font-weight: 300;
            color: rgba(196,161,93,0.05);
            line-height: 1;
            pointer-events: none;
            user-select: none;
        }

        /* Stat strip */
        .stat-strip {
            border-top: 1px solid var(--border);
            padding-top: 3rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }
        .stat-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 300;
            color: var(--white);
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .stat-label {
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ─── SECTION BASE ─── */
        section { position: relative; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 3rem; }
        .section-header {
            display: flex;
            align-items: flex-start;
            gap: 2rem;
            margin-bottom: 5rem;
        }
        .section-header-text { flex: 1; }
        .section-title {
            font-size: clamp(2.5rem, 4vw, 3.8rem);
            color: var(--white);
            margin-top: 1rem;
        }

        /* ─── RISK SECTION ─── */
        .risk-section {
            padding: 8rem 0;
            border-top: 1px solid var(--border);
            background: var(--deep);
        }

        .risk-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            border: 1px solid var(--border);
        }

        .risk-card {
            padding: 3rem;
            border-right: 1px solid var(--border);
            position: relative;
            transition: background 0.3s;
        }
        .risk-card:last-child { border-right: none; }
        .risk-card:hover { background: var(--surface); }

        .risk-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            font-weight: 300;
            color: rgba(196,161,93,0.12);
            line-height: 1;
            margin-bottom: 1.5rem;
        }
        .risk-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--white);
            margin-bottom: 1rem;
        }
        .risk-card p {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.8;
        }
        .risk-accent {
            position: absolute;
            bottom: 0;
            left: 3rem;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.4s ease;
        }
        .risk-card:hover .risk-accent { width: calc(100% - 6rem); }

        /* ─── SERVICES SECTION ─── */
        .services-section {
            padding: 8rem 0;
            border-top: 1px solid var(--border);
        }

        .service-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 4rem;
            padding: 3.5rem 0;
            border-bottom: 1px solid var(--border);
            align-items: start;
            transition: background 0.3s;
        }
        .service-row:first-of-type { border-top: 1px solid var(--border); }
        .service-row:hover { background: var(--surface); margin: 0 -3rem; padding: 3.5rem 3rem; }

        .service-index {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--muted);
            padding-top: 0.25rem;
        }

        .service-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--white);
            margin-bottom: 1rem;
        }

        .service-desc {
            font-size: 0.85rem;
            color: var(--mid);
            margin-bottom: 1.5rem;
            max-width: 480px;
        }

        .service-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .service-tag {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            border: 1px solid rgba(196,161,93,0.25);
            padding: 5px 12px;
        }

        /* ─── METHODOLOGY ─── */
        .method-section {
            padding: 8rem 0;
            border-top: 1px solid var(--border);
            background: var(--deep);
        }

        .method-steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            margin-top: 5rem;
        }

        .method-step {
            padding: 2.5rem;
            border-right: 1px solid var(--border);
            position: relative;
        }
        .method-step:last-child { border-right: none; }

        .step-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 300;
            color: rgba(196,161,93,0.18);
            line-height: 1;
            margin-bottom: 1.5rem;
        }
        .step-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            color: var(--white);
            margin-bottom: 0.75rem;
        }
        .step-desc {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.8;
        }
        .step-active .step-num { color: rgba(196,161,93,0.5); }
        .step-active .step-title { color: var(--gold); }

        /* ─── CONTACT ─── */
        .contact-section {
            padding: 8rem 0;
            border-top: 1px solid var(--border);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 6rem;
            align-items: start;
        }

        .contact-left h2 {
            font-size: clamp(2.5rem, 4vw, 3.5rem);
            color: var(--white);
            margin: 1rem 0 2rem;
        }

        .contact-left p {
            font-size: 0.88rem;
            color: var(--mid);
            margin-bottom: 3rem;
            line-height: 1.9;
        }

        .contact-detail {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--border);
        }
        .contact-detail:first-of-type { border-top: 1px solid var(--border); }
        .detail-label {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            min-width: 80px;
            padding-top: 0.1rem;
        }
        .detail-val {
            font-size: 0.85rem;
            color: var(--light);
        }

        /* FORM */
        .contact-form { display: flex; flex-direction: column; gap: 0; }

        .form-group {
            position: relative;
            border-bottom: 1px solid var(--border);
            transition: border-color 0.25s;
        }
        .form-group:focus-within { border-color: var(--gold); }
        .form-group:first-child { border-top: 1px solid var(--border); }

        .form-group label {
            display: block;
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 1.2rem 0 0;
            transition: color 0.25s;
        }
        .form-group:focus-within label { color: var(--gold); }

        .form-group input,
        .form-group select {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Archivo', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            color: var(--white);
            padding: 0.5rem 0 1.2rem;
            appearance: none;
            -webkit-appearance: none;
        }

        .form-group select { cursor: pointer; }
        .form-group select option { background: var(--raised); color: var(--white); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2rem; }
        .form-row .form-group { grid-column: span 1; }

        .form-submit {
            margin-top: 2.5rem;
            width: 100%;
            background: var(--gold);
            color: var(--ink);
            border: none;
            padding: 1.1rem 2rem;
            font-family: 'Archivo', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s;
        }
        .form-submit:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        .form-note {
            margin-top: 1.2rem;
            font-size: 0.68rem;
            letter-spacing: 0.05em;
            color: var(--muted);
            text-align: center;
        }

        /* ─── FOOTER ─── */
        footer {
            border-top: 1px solid var(--border);
            padding: 2.5rem 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--ink);
        }
        .footer-copy {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .footer-links { display: flex; gap: 2rem; }
        .footer-links a {
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.25s;
        }
        .footer-links a:hover { color: var(--gold); }

        /* ─── MOBILE MENU ─── */
        #mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--white); }
        #mobile-menu { display: none; }

        /* ─── ANIMATIONS ─── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.8s ease forwards; }
        .fade-up-1 { animation-delay: 0.1s; opacity: 0; }
        .fade-up-2 { animation-delay: 0.25s; opacity: 0; }
        .fade-up-3 { animation-delay: 0.4s; opacity: 0; }
        .fade-up-4 { animation-delay: 0.55s; opacity: 0; }

        /* Success state */
        .form-success {
            text-align: center;
            padding: 4rem 2rem;
            display: none;
        }
        .form-success.visible { display: block; }
        .success-icon {
            width: 48px;
            height: 48px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--gold);
        }
        .form-success h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--white);
            margin-bottom: 0.75rem;
        }
        .form-success p {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            header { padding: 0 1.5rem; }
            header nav, header .btn-primary { display: none; }
            #mobile-menu-btn { display: flex; }
            
            .hero { grid-template-columns: 1fr; min-height: auto; }
            .hero-left { padding: 5rem 1.5rem 4rem; border-right: none; border-bottom: 1px solid var(--border); }
            .hero-right { padding: 3rem 1.5rem 4rem; }
            .stat-strip { grid-template-column
